<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PDFLab · Private PDF tools in your browser</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Merge and edit PDFs right in your browser. Fast, free and private: your files never leave your device."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script>
      // Apply the saved theme before first paint to avoid a flash. Kept in sync with ThemeService.
      (function () {
        var mode = 'system';
        try {
          mode = localStorage.getItem('pdflab-theme') || 'system';
        } catch (e) {}
        var dark =
          mode === 'dark' ||
          (mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>

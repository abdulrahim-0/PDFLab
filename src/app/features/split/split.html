<app-tool-page
  title="Split PDF"
  description="Pull out page ranges as separate PDFs, or save every page as its own file."
  processLabel="Split PDF"
  processingLabel="Splitting…"
  [processHint]="
    source.unreadable() ? 'This PDF can’t be split.' : 'Enter valid page ranges to continue.'
  "
  [run]="run"
  [hasFiles]="!!source.item()"
  [canProcess]="ranges().length > 0"
  (process)="split()"
  (startOver)="startOver()"
>
  <app-file-dropzone
    toolUpload
    label="Select PDF file"
    [multiple]="false"
    (filesAdded)="add($event)"
  />

  <app-single-pdf-workspace [source]="source" (remove)="startOver()">
    @if (source.file(); as file) {
      <app-page-grid [file]="file" [pageCount]="source.pageCount() ?? 0" [marks]="marks()" />
    }
  </app-single-pdf-workspace>

  <div toolOptions class="flex flex-col gap-4">
    <app-option-group
      legend="Split mode"
      name="split-mode"
      [columns]="2"
      [options]="modes"
      [value]="mode()"
      (valueChange)="setMode($event)"
    />

    @if (mode() === 'ranges') {
      <div>
        <label for="split-ranges" class="mb-1.5 block text-sm font-semibold">Page ranges</label>
        <input
          id="split-ranges"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          spellcheck="false"
          placeholder="e.g. 1-3, 5, 8-"
          class="h-10 w-full rounded-lg border bg-surface px-3 text-sm"
          [class]="rangeError() ? 'border-error' : 'border-outline-variant'"
          [value]="rangeInput()"
          [attr.aria-invalid]="!!rangeError()"
          aria-describedby="split-ranges-help"
          (input)="setRanges($any($event.target).value)"
        />
        <p
          id="split-ranges-help"
          class="mt-1.5 text-xs"
          [class]="rangeError() ? 'text-error' : 'text-secondary'"
        >
          {{ rangeError() ?? 'Separate ranges with commas. Each range becomes its own PDF.' }}
        </p>
      </div>
    }

    @if (summary()) {
      <p class="rounded-lg bg-surface-container-low p-3 text-sm" aria-live="polite">
        {{ summary() }}
      </p>
    }
  </div>
</app-tool-page>

<app-tool-page
  title="Rotate PDF"
  description="Turn individual pages or the whole document. Quality is untouched."
  processLabel="Rotate PDF"
  processingLabel="Rotating…"
  [processHint]="source.unreadable() ? 'This PDF can’t be rotated.' : 'Rotate at least one page.'"
  [run]="run"
  [hasFiles]="!!source.item()"
  [canProcess]="changedCount() > 0"
  (process)="rotate()"
  (startOver)="startOver()"
>
  <app-file-dropzone
    toolUpload
    label="Select PDF file"
    [multiple]="false"
    (filesAdded)="add($event)"
  />

  <app-single-pdf-workspace [source]="source" (remove)="startOver()">
    @if (source.file(); as file) {
      <app-page-grid
        [file]="file"
        [pageCount]="source.pageCount() ?? 0"
        [rotations]="rotations()"
        [actions]="pageActions"
      />
    }
  </app-single-pdf-workspace>

  <ng-template #pageActions let-page>
    <div class="flex gap-1">
      <button
        type="button"
        class="rounded p-1.5 text-secondary hover:bg-surface-container hover:text-on-surface"
        [attr.aria-label]="'Rotate page ' + page + ' left'"
        (click)="rotatePage(page, -90)"
      >
        <app-icon class="size-4" name="rotate-ccw" />
      </button>
      <button
        type="button"
        class="rounded p-1.5 text-secondary hover:bg-surface-container hover:text-on-surface"
        [attr.aria-label]="'Rotate page ' + page + ' right'"
        (click)="rotatePage(page, 90)"
      >
        <app-icon class="size-4" name="rotate-cw" />
      </button>
    </div>
  </ng-template>

  <div toolOptions class="flex flex-col gap-3">
    <p class="text-sm font-semibold">Rotate all pages</p>
    <div class="grid grid-cols-2 gap-2">
      <button type="button" class="btn btn-secondary" (click)="rotateAll(-90)">
        <app-icon class="size-4" name="rotate-ccw" />
        Left
      </button>
      <button type="button" class="btn btn-secondary" (click)="rotateAll(90)">
        <app-icon class="size-4" name="rotate-cw" />
        Right
      </button>
    </div>
    <p class="rounded-lg bg-surface-container-low p-3 text-sm" aria-live="polite">
      @if (changedCount() === 0) {
        No pages rotated yet. Use the buttons under each page, or rotate them all.
      } @else {
        {{ changedCount() }} {{ changedCount() === 1 ? 'page' : 'pages' }} will be rotated.
      }
    </p>
    @if (changedCount() > 0) {
      <button type="button" class="btn btn-secondary" (click)="reset()">
        <app-icon class="size-4" name="undo" />
        Reset
      </button>
    }
  </div>
</app-tool-page>
